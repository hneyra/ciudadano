# `ciudadano-web`, servido como archivos estaticos BAJO `/portal/`. Y NADA MAS (issue 37).
#
# Portado de `rentas/frontend/nginx.conf` (rentas#44), que es el modelo. Lo que cambia, y por que:
#
# ## Se sirve bajo `/portal/`, no en la raiz
#
# `rentas` sirve en `/` porque su ingreso quita el prefijo (`stripPrefix`) antes de reenviar. Aqui el
# prefijo llega ENTERO, que es lo que pide el issue: `vite.config.ts` construye con `base: '/portal/'`,
# el `Dockerfile` copia el `dist/` a `html/portal/` y este archivo sirve desde `html/`. Las tres cosas
# tienen que decir lo mismo, y las cruza `verificaciones/imagen-y-despliegue.test.ts`.
#
# Asi que la averia del prefijo es la contraria a la de `rentas`: alli, una ruta que TRAE `/rentas/`
# quiere decir que el ingreso no lo quito; aqui, una ruta que NO trae `/portal/` quiere decir que
# alguien lo quito. Se contesta 404 diciendolo (el `location /` de abajo), en vez de dejar al portal
# entero dando 404 mudos.
#
# ## 404 de verdad, y sin el «200 que miente»
#
# En `rentas`, `try_files $uri /index.html` hace que recargar en una ruta funcione, y tambien que un
# `.js` que falta llegue como HTML con un 200 (pantalla en blanco, «Unexpected token '<'»). Aqui las
# rutas del portal viven en el HASH (`#/deudas`): el navegador pide siempre `/portal/`, asi que no
# hace falta ese repliegue y NO lo hay. Lo que no existe, da 404; `/portal/` y nada mas cae al
# `index.html`, y por su nombre.
#
# ## Sin cachear errores
#
# Todo 404 sale por el mismo sitio, `@no_existe`, con `Cache-Control: no-store`. Un 404 guardado
# sobrevive al arreglo: un navegador que se quedo con el de un activo no vuelve a pedirlo aunque el
# activo ya este. Y la cache de un ano de los activos va SIN `always` (medido en rentas#44: con
# `always`, un 404 salia con `immutable` dentro).
#
# ## Sin redirecciones, ni una
#
# Ni `return 301`, ni `rewrite`, ni la barra final que nginx anade por su cuenta a un directorio:
# `/portal` sin barra y `/portal/assets` dan 404, no un 301. Una redireccion la resuelve el
# navegador contra el `Host` y el puerto que ESTE contenedor cree tener, que detras de un ingreso no
# son los de fuera. Si hace falta llevar `/portal` a `/portal/`, es cosa del ingreso.
#
# ## Tampoco hay reenvio a la API (rentas#44)
#
# El mismo origen lo pone el ingreso, que parte la ruta entre el backend y esta interfaz dentro del
# mismo `Host`. Hacerlo aqui ademas seria un segundo camino a la API que nadie revisa.
#
# ## Las cabeceras de seguridad van REPETIDAS en cada bloque, y no es descuido (rentas#44)
#
# `add_header` **no se hereda**: un bloque que declara una cabecera propia descarta TODAS las del nivel
# de arriba. Van las tres en cada bloque, y con `always` para que salgan tambien en los errores: un
# 404 tambien se puede enmarcar en un `iframe`. Y un solo `Cache-Control` por respuesta.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No se anuncia la version.
    server_tokens off;

    # Comprimir lo que se repite. Las imagenes ya vienen comprimidas.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Todo 404 sale por aqui: con las tres cabeceras y sin cache. `=404` en cada `try_files` lo manda
    # aqui, y un `location` que no dice nada del error tambien.
    error_page 404 @no_existe;

    location @no_existe {
        # Mapa de tipos vacio: sin el, nginx deduciria el tipo de la extension de la URI y este texto
        # saldria etiquetado `application/javascript` al pedir un `.js` que falta (medido en rentas#44).
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404 "No existe.\n";
    }

    # ── Fuera de /portal/: la averia del prefijo, dicha en voz alta ─────────────────────────
    location / {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404 "Este contenedor sirve el portal bajo /portal/ y nada fuera de ahi. Si la peticion venia de un ingreso, revisa que NO quite el prefijo /portal (un stripPrefix en el IngressRoute o en las etiquetas de Traefik).\n";
    }

    # ── La portada: el index.html, sin redirigir ─────────────────────────────────────────────
    #
    # `try_files` con el archivo por su nombre, y no `index`: `index` haria una redireccion INTERNA y
    # esto la ahorra. `no-cache` y no `no-store`: el navegador puede guardarla, pero pregunta antes de
    # usarla, y asi un despliegue nuevo se ve en la siguiente carga.
    location = /portal/ {
        try_files /portal/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /portal/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Las senias del ambiente ──────────────────────────────────────────────────────────────
    #
    # Este archivo se SUSTITUYE en el despliegue montando otro encima (el patron del `ConfigMap` de
    # `rentas`), sin reconstruir la imagen. `no-store` y no `no-cache`: un navegador que se quedara con
    # el anterior mandaria al ciudadano al emisor OIDC del ambiente que fuera. Ver
    # `src/api/configuracion.ts` y `public/configuracion.js`.
    location = /portal/configuracion.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── La vuelta del canje silencioso (issue 35) ────────────────────────────────────────────
    #
    # La abre el portal en un marco oculto hacia el emisor, que la devuelve con `?code=…` o
    # `?error=…`. Sin huella en el nombre, asi que `no-cache` como el `index.html`: si cambia, el
    # siguiente canje tiene que coger la nueva.
    #
    # Y es la UNICA pagina con `X-Frame-Options: SAMEORIGIN` en vez de `DENY`, porque es la unica que
    # se dibuja dentro de un marco: el del propio portal. `DENY` prohibe enmarcarla tambien al mismo
    # origen, y con el el navegador se negaria a dibujarla y el canje silencioso no volveria nunca.
    # `SAMEORIGIN` sigue impidiendo que la enmarque otro sitio.
    location = /portal/silencio.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Los activos con huella ───────────────────────────────────────────────────────────────
    #
    # La huella en el nombre es lo que hace seguro el ano de cache: si el contenido cambia, el nombre
    # cambia. `Cache-Control` SIN `always`, y es lo contrario que las tres de seguridad: sin `always`
    # solo se aplica a los 2xx, y un 404 sale por `@no_existe` con `no-store`.
    location /portal/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Cualquier otro archivo bajo /portal/ ─────────────────────────────────────────────────
    #
    # Hoy no hay ninguno mas: lo que `public/` trae tiene su bloque arriba. Si llega uno, se sirve con
    # `no-cache` —sin huella no se sabe cuando cambia— y lo que no exista, 404.
    location /portal/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
